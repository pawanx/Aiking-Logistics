services:
  # ── Backend API & In-Memory Worker (Free Web Service) ─────────────────────────
  - type: web
    name: aiking-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npx prisma db push --skip-generate && npm run seed && node apps/api/dist/main.js
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: both
      - key: QUEUE_DRIVER
        value: inline
      - key: API_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_URL
        sync: false # Paste your free Neon.tech or Supabase PostgreSQL connection URL

  # ── Frontend Web Portal (Free Static Site) ────────────────────────────────────
  - type: web
    name: aiking-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm run build --workspace @aiking/shared && npm run build --workspace @aiking/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aiking-api
          type: web
          property: host
